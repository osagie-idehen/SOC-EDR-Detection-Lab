# Splunk Enterprise SOC Correlation Searches & Alert Rules
# Project: SOC-Lab-Portfolio / Splunk-Threat-Hunting-Lab
# Author: Osagie Henry Idehen

[Correlation - Brute Force & Password Spraying Detected]
action.email.sendresults = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 10m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Detects 5 or more failed logon attempts (EventCode 4625) within a 5-minute window from the same source IP or targeting the same user account.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=windows_security EventCode=4625 \
| stats count, values(user) as targeted_users, values(workstation) as workstations, values(sub_status) as failure_reasons by src_ip \
| where count >= 5 \
| eval risk_score=85, mitre_technique="T1110.001 - Password Guessing / Brute Force"

[Correlation - Compromised Account Success After Brute Force]
action.email.sendresults = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 15m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = High-priority alert triggered when a successful network/remote logon (EventCode 4624) occurs from an IP address that previously generated failed logons.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=windows_security EventCode=4624 (Logon_Type=3 OR Logon_Type=10) \
[ search index=windows_security EventCode=4625 \
  | stats count by src_ip \
  | where count >= 3 \
  | fields src_ip ] \
| table _time, computer_name, user, src_ip, logon_type \
| eval alert_name="Confirmed Account Breach After Failed Logons", severity="CRITICAL", mitre_technique="T1078 - Valid Accounts"

[Correlation - Suspicious LOLBAS or Encoded PowerShell Execution]
action.email.sendresults = 1
alert.severity = 4
alert.track = 1
cron_schedule = */5 * * * *
description = Detects encoded PowerShell executions (-enc / -encodedcommand) or Living-off-the-Land Binaries (certutil.exe file download).
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
search = index=sysmon EventCode=1 \
(Image="*\\powershell.exe" AND (CommandLine="*-enc*" OR CommandLine="*-w hidden*" OR CommandLine="*downloadstring*")) \
OR (Image="*\\certutil.exe" AND CommandLine="*-urlcache*") \
| table _time, computer_name, user, Image, CommandLine, ParentImage, Hashes \
| eval mitre_technique="T1059.001 (PowerShell) / T1105 (Ingress Tool Transfer)"

[Correlation - Unauthorized Rogue User Added to Domain Admins]
action.email.sendresults = 1
alert.severity = 5
alert.track = 1
cron_schedule = */5 * * * *
description = Triggers immediately upon detection of any account added to Domain Admins or Enterprise Admins.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
search = index=windows_security EventCode=4728 (group_name="*Domain Admins*" OR group_name="*Enterprise Admins*" OR group_name="*Administrators*") \
| table _time, computer_name, subject_user_name, target_user_name, group_name \
| eval alert_name="Privilege Escalation: Member Added to Admin Group", severity="CRITICAL", mitre_technique="T1098 - Account Manipulation"

[Correlation - Security Audit Log Cleared (Event ID 1102)]
action.email.sendresults = 1
alert.severity = 5
alert.track = 1
cron_schedule = */5 * * * *
description = Detects anti-forensics activity where the Windows Security log is cleared.
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
search = index=windows_security EventCode=1102 \
| table _time, computer_name, user, domain \
| eval alert_name="Defense Evasion: Security Event Log Cleared", severity="CRITICAL", mitre_technique="T1070.001 - Clear Windows Event Logs"
